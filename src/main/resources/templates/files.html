<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${itemName != null ? itemName : '目录'}">目录</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { --bg: #101010; --text: #eee; --muted: #9a9a9a; --accent: #52b54b; --card: #1c1c1c; --line: #2c2c2c; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px;
            background: rgba(16,16,16,.95); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20;
        }
        .topbar-actions { flex: none; }
        .emby-top-btn {
            display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 6px;
            border: 1px solid #3a5a3a; background: rgba(82,181,75,.15); color: var(--accent);
            text-decoration: none; font-size: .85rem; white-space: nowrap;
        }
        .emby-top-btn:hover { background: rgba(82,181,75,.28); }
        .crumb { flex: 1; min-width: 0; }
        .crumb { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .95rem; }
        .crumb a { color: var(--accent); text-decoration: none; }
        .crumb .sep { color: #555; }
        .container { max-width: 1400px; margin: 0 auto; padding: 22px 24px 48px; }
        .missing { color: var(--muted); padding: 48px 0; text-align: center; }
        .section { margin-bottom: 22px; }
        .section h2 { font-size: .9rem; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
        .dirs { display: flex; flex-wrap: wrap; gap: 10px; }
        .dir {
            display: inline-flex; align-items: center; gap: 8px; background: var(--card);
            border: 1px solid var(--line); color: inherit;
            border-radius: 8px; padding: 8px 10px 8px 14px; max-width: 460px;
        }
        .dir:hover { border-color: #444; }
        .dir-link { display: inline-flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; min-width: 0; flex: 1; }
        .dir span, .file-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ops { display: inline-flex; gap: 6px; margin-left: 8px; flex: none; }
        .mini {
            border: 1px solid #444; background: transparent; color: #ddd; border-radius: 4px;
            padding: 2px 8px; cursor: pointer; font-size: .75rem;
        }
        .mini.danger { color: #ff6b6b; border-color: #6a3030; }
        .files { display: flex; flex-direction: column; gap: 8px; }
        .file-row {
            display: flex; align-items: center; gap: 10px; background: var(--card);
            border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px;
        }
        .file-row span { flex: 1; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .pic-card { background: var(--card); border-radius: 8px; overflow: hidden; cursor: pointer; }
        .pic-card img { width: 100%; height: 160px; object-fit: cover; display: block; background: #2a2a2a; }
        .pic-card p { padding: 8px 10px 0; font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pic-ops { display: flex; gap: 6px; padding: 8px 10px 10px; }
        .no-thumb { height: 160px; display: flex; align-items: center; justify-content: center; color: var(--muted); background: #2a2a2a; font-size: .85rem; }
        .viewer {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,.88);
            z-index: 100;
        }
        .viewer.show { display: block; }
        .viewer-stage {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .viewer img { max-width: 92vw; max-height: 86vh; object-fit: contain; transform-origin: center center; }
        .nav {
            position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
            width: 44px; height: 72px; border: none; border-radius: 8px;
            background: rgba(0,0,0,.45); color: #fff; font-size: 2rem; cursor: pointer;
        }
        .nav:hover { background: rgba(0,0,0,.7); }
        .nav:disabled { opacity: .3; cursor: default; }
        .nav.prev { left: 16px; }
        .nav.next { right: 16px; }
        .reset-zoom {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 2;
            border: none; border-radius: 999px; background: rgba(255,255,255,.16); color: #fff;
            padding: 8px 14px; cursor: pointer; font-size: .85rem;
        }
        .reset-zoom:hover { background: rgba(255,255,255,.28); }
    </style>
</head>
<body th:data-item-id="${itemId}">
<div class="topbar">
    <div class="crumb">
        <a th:href="@{/files(itemId=${itemId})}" th:text="${itemName}">文件夹</a>
        <th:block th:each="c : ${crumbs}">
            <span class="sep">/</span>
            <a th:href="@{/files(itemId=${itemId}, rel=${c.rel})}" th:text="${c.name}">子目录</a>
        </th:block>
    </div>
    <div class="topbar-actions"
         th:if="${embyLibraryId != null and embyLibraryId != '' and embyBrowseParentId != null and embyBrowseParentId != ''}">
        <a class="emby-top-btn" title="在 Emby 中打开当前文件夹"
           th:href="@{/media(libraryId=${embyLibraryId}, parentId=${embyBrowseParentId}, view=folder, flat=0)}">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path fill="none" stroke="currentColor" stroke-width="2" d="M3 7h6l2 2h10v9H3V7z"/>
            </svg>
            打开Emby文件夹
        </a>
    </div>
</div>
<div class="container">
    <div class="missing" th:if="${missing}">找不到对应目录</div>
    <th:block th:unless="${missing}">
        <div class="section" th:if="${directories != null and !directories.isEmpty()}">
            <h2>子目录</h2>
            <div class="dirs">
                <div class="dir" th:each="d : ${directories}">
                    <a class="dir-link" th:href="@{/files(itemId=${itemId}, rel=${d.rel})}">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path fill="#52b54b" d="M10 4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2h6z"/>
                        </svg>
                        <span th:text="${d.name}">目录</span>
                    </a>
                    <div class="ops">
                        <button type="button" class="mini" data-act="rename" data-kind="dir"
                                th:data-rel="${d.rel}" th:data-name="${d.name}">重命名</button>
                        <button type="button" class="mini danger" data-act="delete" data-kind="dir"
                                th:data-rel="${d.rel}" th:data-name="${d.name}">删除</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="section" th:if="${images != null and !images.isEmpty()}">
            <h2>图片</h2>
            <div class="grid">
                <div class="pic-card" th:each="img : ${images}"
                     th:data-full="@{/api/files/image(itemId=${itemId}, rel=${img.rel})}">
                    <img th:if="${img.thumb == '1'}"
                         th:src="@{/api/files/thumb(itemId=${itemId}, rel=${img.rel})}"
                         th:alt="${img.name}"
                         loading="lazy">
                    <div class="no-thumb" th:if="${img.thumb != '1'}">仅文件名</div>
                    <p th:text="${img.name}">图片</p>
                    <div class="pic-ops">
                        <button type="button" class="mini" data-act="rename" data-kind="file"
                                th:data-rel="${img.rel}" th:data-name="${img.name}">重命名</button>
                        <button type="button" class="mini danger" data-act="delete" data-kind="file"
                                th:data-rel="${img.rel}" th:data-name="${img.name}">删除</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="section" th:if="${files != null and !files.isEmpty()}">
            <h2>其他文件</h2>
            <div class="files">
                <div class="file-row" th:each="f : ${files}">
                    <span th:text="${f.name}">文件</span>
                    <div class="ops">
                        <button type="button" class="mini" data-act="rename" data-kind="file"
                                th:data-rel="${f.rel}" th:data-name="${f.name}">重命名</button>
                        <button type="button" class="mini danger" data-act="delete" data-kind="file"
                                th:data-rel="${f.rel}" th:data-name="${f.name}">删除</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="missing"
             th:if="${(directories == null or directories.isEmpty()) and (images == null or images.isEmpty()) and (files == null or files.isEmpty())}">
            这个目录是空的。
        </div>
    </th:block>
</div>
<div class="viewer" id="viewer">
    <button type="button" class="nav prev" id="prevBtn" aria-label="上一张">‹</button>
    <div class="viewer-stage" id="viewerStage">
        <img id="viewerImg" alt="">
    </div>
    <button type="button" class="nav next" id="nextBtn" aria-label="下一张">›</button>
    <button type="button" class="reset-zoom" id="resetZoom">恢复默认大小</button>
</div>
<script>
    const viewer = document.getElementById('viewer');
    const viewerStage = document.getElementById('viewerStage');
    const viewerImg = document.getElementById('viewerImg');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resetZoom = document.getElementById('resetZoom');
    const pics = Array.from(document.querySelectorAll('.pic-card[data-full]'));
    let index = 0;
    let scale = 1;

    function applyScale() {
        viewerImg.style.transform = 'scale(' + scale + ')';
    }
    function updateArrows() {
        prevBtn.disabled = index <= 0;
        nextBtn.disabled = index >= pics.length - 1;
    }
    function showAt(i) {
        if (i < 0 || i >= pics.length) return;
        index = i;
        scale = 1;
        applyScale();
        viewerImg.src = pics[i].getAttribute('data-full');
        viewerImg.alt = pics[i].querySelector('p') ? pics[i].querySelector('p').textContent : '';
        viewer.classList.add('show');
        updateArrows();
    }
    function closeViewer() {
        viewer.classList.remove('show');
        viewerImg.removeAttribute('src');
        scale = 1;
        applyScale();
    }
    pics.forEach(function (card, i) {
        card.addEventListener('click', function (e) {
            if (e.target.closest('[data-act]')) return;
            showAt(i);
        });
    });
    prevBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        showAt(index - 1);
    });
    nextBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        showAt(index + 1);
    });
    resetZoom.addEventListener('click', function (e) {
        e.stopPropagation();
        scale = 1;
        applyScale();
    });
    viewerImg.addEventListener('wheel', function (e) {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : (1 / 1.1);
        scale = Math.min(8, Math.max(0.2, scale * factor));
        applyScale();
    }, { passive: false });
    viewer.addEventListener('click', function (e) {
        if (e.target === viewer || e.target === viewerStage) closeViewer();
    });
    document.addEventListener('keydown', function (e) {
        if (!viewer.classList.contains('show')) return;
        if (e.key === 'ArrowLeft') {
            e.preventDefault();
            showAt(index - 1);
        } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            showAt(index + 1);
        }
    });

    const pageItemId = document.body.getAttribute('data-item-id');
    document.querySelectorAll('[data-act]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            const act = btn.getAttribute('data-act');
            const rel = btn.getAttribute('data-rel') || '';
            const name = btn.getAttribute('data-name') || '';
            const kind = btn.getAttribute('data-kind') || 'file';
            if (!rel) return;
            if (act === 'delete') {
                const msg = kind === 'dir'
                    ? '即将删除文件夹 「' + name + '」 及其内部的文件，无法撤销。'
                    : '即将删除文件 「' + name + '」，无法撤销。';
                if (!confirm(msg)) return;
                const body = new URLSearchParams();
                body.set('itemId', pageItemId);
                body.set('rel', rel);
                fetch('/api/files/delete', { method: 'POST', body: body })
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        if (!data.success) { alert(data.message || '删除失败'); return; }
                        location.reload();
                    })
                    .catch(function (err) { alert('请求失败: ' + err.message); });
                return;
            }
            const next = prompt('重命名为', name);
            if (next == null) return;
            const trimmed = next.trim();
            if (!trimmed || trimmed === name) return;
            const body = new URLSearchParams();
            body.set('itemId', pageItemId);
            body.set('rel', rel);
            body.set('name', trimmed);
            fetch('/api/files/rename', { method: 'POST', body: body })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (!data.success) { alert(data.message || '重命名失败'); return; }
                    location.reload();
                })
                .catch(function (err) { alert('请求失败: ' + err.message); });
        });
    });
</script>
</body>
</html>
