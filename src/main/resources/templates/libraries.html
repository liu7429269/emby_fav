<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体库 - Emby 浏览</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg: #101010;
            --surface: #1a1a1a;
            --text: #eee;
            --muted: #999;
            --accent: #52b54b;
            --card: #202020;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: rgba(16,16,16,.92);
            border-bottom: 1px solid #2a2a2a;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .brand { font-size: 1.25rem; font-weight: 700; letter-spacing: .02em; }
        .brand span { color: var(--accent); }
        .user { color: var(--muted); font-size: .9rem; }
        .user a { color: var(--accent); margin-left: 12px; text-decoration: none; }
        .top-search { display: flex; align-items: stretch; flex: 1; max-width: 560px; min-width: 220px; margin: 0 20px; }
        .top-search select, .top-search input[type="search"] {
            background: #121212; border: 1px solid #333; color: var(--text); height: 34px; font-size: .9rem;
        }
        .top-search select { border-radius: 6px 0 0 6px; padding: 0 8px; max-width: 150px; }
        .top-search input[type="search"] { flex: 1; border-left: none; padding: 0 10px; min-width: 0; }
        .top-search button { height: 34px; border: none; border-radius: 0 6px 6px 0; background: var(--accent); color: #fff; padding: 0 14px; cursor: pointer; font-weight: 600; }
        .container { max-width: 1400px; margin: 0 auto; padding: 28px; }
        h1 { font-size: 1.6rem; margin-bottom: 8px; }
        .sub { color: var(--muted); margin-bottom: 28px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card);
            border-radius: 8px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 28px rgba(0,0,0,.45);
        }
        .cover {
            aspect-ratio: 16 / 9;
            background: #2a2a2a center/cover no-repeat;
            position: relative;
        }
        .cover .badge {
            position: absolute;
            left: 10px;
            bottom: 10px;
            background: rgba(0,0,0,.7);
            color: #fff;
            font-size: .75rem;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .meta { padding: 14px 16px 18px; }
        .meta h2 { font-size: 1.1rem; margin-bottom: 6px; }
        .meta p { color: var(--muted); font-size: .85rem; }
        .empty { color: var(--muted); padding: 40px 0; text-align: center; }
    </style>
</head>
<body>
<div class="topbar">
    <div class="brand">Emby <span>Browse</span></div>
    <form class="top-search" action="/search" method="get">
        <select name="scope">
            <option value="all" selected>全局</option>
            <option th:each="lib : ${libraries}" th:value="${lib.id}" th:text="${lib.name}">库</option>
        </select>
        <input type="search" name="q" placeholder="搜索媒体…" required>
        <button type="submit">搜索</button>
    </form>
    <div class="user">
        <span th:text="${userName}">用户</span>
        <a href="/logout">退出</a>
    </div>
</div>
<div class="container">
    <h1>我的媒体库</h1>
    <p class="sub">选择一个库开始浏览</p>
    <div class="grid" th:if="${libraries != null and !libraries.isEmpty()}">
        <a class="card" th:each="lib : ${libraries}" th:href="@{/media(libraryId=${lib.id})}">
            <div class="cover"
                 th:style="|background-image:url(/api/image/${lib.id}?type=Primary&amp;maxHeight=400)|">
                <span class="badge" th:text="${lib.collectionType != null ? lib.collectionType : 'library'}">movies</span>
            </div>
            <div class="meta">
                <h2 th:text="${lib.name}">库名</h2>
                <p th:if="${lib.childCount != null}" th:text="'约 ' + ${lib.childCount} + ' 项'">子项</p>
            </div>
        </a>
    </div>
    <div class="empty" th:if="${libraries == null or libraries.isEmpty()}">暂无可用媒体库</div>
</div>
</body>
</html>
