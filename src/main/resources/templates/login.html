<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Emby Browse</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg: #101010;
            --panel: #1a1a1a;
            --text: #eee;
            --muted: #999;
            --accent: #52b54b;
            --line: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(ellipse at top, #1c2a1c 0%, transparent 55%),
                var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }
        .login-container {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 36px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,.45);
        }
        .login-header { text-align: center; margin-bottom: 28px; }
        .login-header h1 { font-size: 1.7rem; margin-bottom: 8px; }
        .login-header h1 span { color: var(--accent); }
        .login-header p { color: var(--muted); font-size: .92rem; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            color: var(--muted);
            margin-bottom: 8px;
            font-size: .85rem;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 1rem;
            background: #121212;
            color: var(--text);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .server-info {
            background: #141414;
            border: 1px solid var(--line);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: .85rem;
            color: var(--muted);
            word-break: break-all;
        }
        .server-info strong { color: #ddd; }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-login:hover { filter: brightness(1.08); }
        .btn-login:disabled { opacity: .6; cursor: not-allowed; }
        .loading-hint {
            text-align: center;
            color: var(--accent);
            font-size: .85rem;
            margin-top: 10px;
            min-height: 1.2em;
        }
        .error-message {
            background: #2a1515;
            color: #ff8e8e;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            border-left: 3px solid #c44;
            font-size: .9rem;
        }
        .footer {
            text-align: center;
            margin-top: 18px;
            color: #666;
            font-size: .8rem;
        }
        .remember-group { margin-bottom: 22px; }
        .remember-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--muted);
            font-size: .9rem;
        }
        .remember-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>Emby <span>Browse</span></h1>
        <p>使用 Emby 账号登录</p>
    </div>

    <div th:if="${error}" class="error-message" th:text="${error}">错误信息</div>

    <div class="server-info" style="display:none;">
        <strong>服务器：</strong><span th:text="${embyServerUrl}">https://nemby.kkangus.top:11443</span>
    </div>

    <form id="loginForm" novalidate>
        <div class="form-group">
            <label for="server">服务器地址</label>
            <input type="text" id="server" name="server" required
                   placeholder="例如 https://nemby.kkangus.top:11443"
                   th:value="${embyServerUrl}">
        </div>
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required
                   placeholder="Emby 用户名" th:value="${defaultUsername}">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required
                   placeholder="Emby 密码" th:value="${defaultPassword}">
        </div>
        <div class="form-group remember-group">
            <label class="remember-label">
                <input type="checkbox" id="remember" name="remember">
                <span>记住服务器地址、账号、密码</span>
            </label>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">登录</button>
        <div class="loading-hint" id="loadingHint"></div>
    </form>

    <div class="footer">
        <p>登录后可浏览媒体库、按标签与最爱筛选</p>
    </div>
</div>

<script>
    (function () {
        var KEY = 'embyBrowseLogin';
        var serverEl = document.getElementById('server');
        var userEl = document.getElementById('username');
        var pwdEl = document.getElementById('password');
        var rememberEl = document.getElementById('remember');

        // 从 localStorage 恢复记住的凭据
        try {
            var saved = JSON.parse(localStorage.getItem(KEY) || '{}');
            if (saved.server) serverEl.value = saved.server;
            if (saved.username) userEl.value = saved.username;
            if (saved.password) pwdEl.value = saved.password;
            if (saved.remember) rememberEl.checked = true;
        } catch (e) {}

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var btn = document.getElementById('loginBtn');
            var hint = document.getElementById('loadingHint');
            var originalText = btn.textContent;

            var server = serverEl.value.trim();
            var username = userEl.value.trim();
            var password = pwdEl.value;
            var remember = rememberEl.checked;

            if (!server) { showError('请填写服务器地址'); return; }
            if (!username) { showError('请填写用户名'); return; }
            if (!password) { showError('请填写密码'); return; }

            btn.disabled = true;
            btn.textContent = '登录中...';
            hint.textContent = '正在连接 Emby 服务器，请稍候…';
            hideError();

            // 记住 / 清除凭据
            try {
                if (remember) {
                    localStorage.setItem(KEY, JSON.stringify({
                        server: server, username: username, password: password, remember: true
                    }));
                } else {
                    localStorage.removeItem(KEY);
                }
            } catch (err) {}

            var formData = new FormData();
            formData.append('server', server);
            formData.append('username', username);
            formData.append('password', password);

            var controller = new AbortController();
            var timeoutId = setTimeout(function () { controller.abort(); }, 30000);

            fetch('/api/login', { method: 'POST', body: formData, signal: controller.signal })
                .then(function (r) {
                    if (!r.ok) throw new Error('服务响应异常 (HTTP ' + r.status + ')');
                    return r.json();
                })
                .then(function (data) {
                    if (data.success) {
                        hint.textContent = '登录成功，正在跳转…';
                        window.location.href = data.redirect || '/libraries';
                        return;
                    }
                    showError(data.message || '登录失败');
                    resetBtn();
                })
                .catch(function (err) {
                    var msg = err.name === 'AbortError'
                        ? '登录超时：Emby 服务器连接过慢，请检查服务器地址或网络'
                        : ('登录请求失败: ' + err.message + '。请确认应用已在 http://localhost:8383 运行');
                    showError(msg);
                    resetBtn();
                })
                .finally(function () { clearTimeout(timeoutId); });

            function resetBtn() {
                btn.disabled = false;
                btn.textContent = originalText;
                hint.textContent = '';
            }
        });

        function hideError() {
            var errorDiv = document.querySelector('.error-message');
            if (errorDiv) errorDiv.style.display = 'none';
        }

        function showError(msg) {
            var errorDiv = document.querySelector('.error-message');
            if (!errorDiv) {
                errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                document.getElementById('loginForm').parentNode.insertBefore(errorDiv, document.getElementById('loginForm'));
            }
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }
    })();
</script>
</body>
</html>
